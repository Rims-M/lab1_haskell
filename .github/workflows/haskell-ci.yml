name: Haskell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.2.0'
          enable-stack: false

      - name: Update Cabal package list
        run: cabal update

      - name: Install HUnit
        run: cabal install --lib HUnit --package-env .

      - name: Compile task 1
        run: ghc --make -Wall -Werror -O2 1_uzd_haskell.hs -o demo1

      - name: Run task 1 unit tests
        run: ./demo1

      - name: Compile task 2
        run: ghc --make -Wall -Werror -O2 2_uzd_haskell.hs -o demo2

      - name: Run task 2 unit tests
        run: echo "test" | ./demo2

      - name: Compile task 3
        run: ghc --make -Wall -Werror -O2 3_uzd_haskell.hs -o demo3

      - name: Run task 3 unit tests
        run: echo "test sentence" | ./demo3

      - name: Compile task 4
        run: ghc --make -Wall -Werror -O2 4_uzd_haskell.hs -o demo4

      - name: Run task 4 unit tests
        run: ./demo4

      - name: Compile task 5
        run: ghc --make -Wall -Werror -O2 5_uzd_haskell.hs -o demo5

      - name: Run task 5 unit tests
        run: ./demo5

      - name: Compile task 6
        run: ghc --make -Wall -Werror -O2 6_uzd_haskell.hs -o demo6

      - name: Run task 6 unit tests
        run: ./demo6